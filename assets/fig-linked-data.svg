<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
  <defs>
    <linearGradient id="ld-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#005b7f"/>
      <stop offset="100%" stop-color="#03455f"/>
    </linearGradient>
    <linearGradient id="ld-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#179C7d"/>
      <stop offset="100%" stop-color="#0e7258"/>
    </linearGradient>
    <linearGradient id="ld-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f58220"/>
      <stop offset="100%" stop-color="#c96808"/>
    </linearGradient>
    <marker id="ld-arr-blue" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#005b7f"/>
    </marker>
    <marker id="ld-arr-green" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#179C7d"/>
    </marker>
    <marker id="ld-arr-orange" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#f58220"/>
    </marker>
    <marker id="ld-arr-gray" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#a6bbc8"/>
    </marker>
    <filter id="ld-shadow-sm">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
    <filter id="ld-shadow-node">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.11"/>
    </filter>
    <filter id="ld-shadow-panel">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#005b7f" flood-opacity="0.13"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="490" fill="#f0f4f7" rx="12"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#005b7f">Linked Data Foundation</text>
  <text x="450" y="48" text-anchor="middle" font-size="11" fill="#6c757d">Knowledge artifacts live at persistent URIs — linked by meaning, queryable by any system</text>

  <!-- Top section label -->
  <text x="24" y="67" font-size="9" font-weight="700" fill="#a6bbc8" letter-spacing="1.5">KNOWLEDGE GRAPH — THREE LINKED ARTIFACTS</text>

  <!-- =========================================================== -->
  <!-- KNOWLEDGE GRAPH (top section)                               -->
  <!-- =========================================================== -->

  <!-- NODE 1: Material Product (cx=175, cy=146, r=48) -->
  <circle cx="175" cy="146" r="48" fill="white" stroke="#005b7f" stroke-width="2.5" filter="url(#ld-shadow-node)"/>
  <circle cx="175" cy="146" r="42" fill="#005b7f" opacity="0.04"/>
  <text x="175" y="139" text-anchor="middle" font-size="11" font-weight="700" fill="#005b7f">Material</text>
  <text x="175" y="153" text-anchor="middle" font-size="11" font-weight="700" fill="#005b7f">Product</text>
  <text x="175" y="167" text-anchor="middle" font-size="8" fill="#a6bbc8">pmd:MaterialProduct</text>
  <text x="175" y="205" text-anchor="middle" font-size="8.5" fill="#6c757d">productcatalog.materials.digital</text>
  <text x="175" y="217" text-anchor="middle" font-size="8.5" font-weight="600" fill="#005b7f">/product/steel-s355</text>

  <!-- NODE 2: Measurement Dataset (cx=450, cy=114, r=48) -->
  <circle cx="450" cy="114" r="48" fill="white" stroke="#179C7d" stroke-width="2.5" filter="url(#ld-shadow-node)"/>
  <circle cx="450" cy="114" r="42" fill="#179C7d" opacity="0.04"/>
  <text x="450" y="107" text-anchor="middle" font-size="11" font-weight="700" fill="#179C7d">Measurement</text>
  <text x="450" y="121" text-anchor="middle" font-size="11" font-weight="700" fill="#179C7d">Dataset</text>
  <text x="450" y="135" text-anchor="middle" font-size="8" fill="#a6bbc8">pmd:TestResult</text>
  <text x="450" y="174" text-anchor="middle" font-size="8.5" fill="#6c757d">dataportal.material-digital.de</text>
  <text x="450" y="186" text-anchor="middle" font-size="8.5" font-weight="600" fill="#179C7d">/dataset/tensile-s355-001</text>

  <!-- Literal value badge -->
  <rect x="513" y="90" width="104" height="30" rx="15" fill="#e8f5f0" stroke="#179C7d" stroke-width="1"/>
  <text x="565" y="104" text-anchor="middle" font-size="8.5" font-weight="600" fill="#0e7258">qudt:value</text>
  <text x="565" y="116" text-anchor="middle" font-size="8.5" fill="#0e7258">"420 MPa"</text>
  <line x1="513" y1="105" x2="490" y2="111" stroke="#a6bbc8" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- NODE 3: PMDCO Concept (cx=725, cy=146, r=48) -->
  <circle cx="725" cy="146" r="48" fill="white" stroke="#f58220" stroke-width="2.5" filter="url(#ld-shadow-node)"/>
  <circle cx="725" cy="146" r="42" fill="#f58220" opacity="0.04"/>
  <text x="725" y="139" text-anchor="middle" font-size="11" font-weight="700" fill="#f58220">PMDCO</text>
  <text x="725" y="153" text-anchor="middle" font-size="11" font-weight="700" fill="#f58220">Concept</text>
  <text x="725" y="167" text-anchor="middle" font-size="8" fill="#a6bbc8">owl:Class</text>
  <text x="725" y="205" text-anchor="middle" font-size="8.5" fill="#6c757d">w3id.org/pmd/co</text>
  <text x="725" y="217" text-anchor="middle" font-size="8.5" font-weight="600" fill="#f58220">#YieldStrength</text>

  <!-- EDGES -->
  <!-- Product → Measurement: dcat:relation -->
  <line x1="221" y1="135" x2="400" y2="120" stroke="#005b7f" stroke-width="1.8" marker-end="url(#ld-arr-blue)"/>
  <rect x="268" y="112" width="90" height="16" rx="8" fill="#e8f1f6"/>
  <text x="313" y="124" text-anchor="middle" font-size="8.5" font-weight="600" fill="#005b7f">dcat:relation</text>

  <!-- Measurement → PMDCO: rdf:type -->
  <line x1="499" y1="120" x2="677" y2="135" stroke="#f58220" stroke-width="1.8" marker-end="url(#ld-arr-orange)"/>
  <rect x="553" y="118" width="64" height="16" rx="8" fill="#fef3e8"/>
  <text x="585" y="130" text-anchor="middle" font-size="8.5" font-weight="600" fill="#f58220">rdf:type</text>

  <!-- Product → PMDCO: shared vocabulary (curved below) -->
  <path d="M 223,151 Q 450,236 677,151" fill="none" stroke="#a6bbc8" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ld-arr-gray)"/>
  <rect x="368" y="230" width="164" height="16" rx="8" fill="#f0f4f7" stroke="#c8d8e4" stroke-width="1"/>
  <text x="450" y="242" text-anchor="middle" font-size="8.5" font-weight="600" fill="#6c757d">shared vocabulary grounding</text>

  <!-- =========================================================== -->
  <!-- SEPARATOR                                                    -->
  <!-- =========================================================== -->
  <line x1="20" y1="256" x2="880" y2="256" stroke="#c8d8e4" stroke-width="1.2" stroke-dasharray="5,5"/>
  <text x="24" y="273" font-size="9" font-weight="700" fill="#a6bbc8" letter-spacing="1.5">PMD DATAPORTAL — FEDERATED CATALOG &amp; QUERY STACK</text>

  <!-- =========================================================== -->
  <!-- INFRASTRUCTURE ROW (y=281 to y=355, height=74)              -->
  <!-- =========================================================== -->

  <!-- BOX A: Distributed Project Catalogs (x=20, w=184) -->
  <rect x="20" y="281" width="184" height="74" rx="8" fill="white" stroke="#c8d8e4" stroke-width="1.5" filter="url(#ld-shadow-sm)"/>
  <rect x="20" y="281" width="5" height="74" rx="2" fill="#f58220"/>
  <text x="115" y="299" text-anchor="middle" font-size="10.5" font-weight="700" fill="#343a40">Project Catalogs</text>
  <text x="115" y="312" text-anchor="middle" font-size="8.5" fill="#6c757d">per-project CKAN instances</text>
  <text x="115" y="324" text-anchor="middle" font-size="8.5" fill="#6c757d">or any DCAT-compatible source</text>
  <!-- Federation badge -->
  <rect x="56" y="333" width="120" height="15" rx="7" fill="#fef3e8"/>
  <text x="116" y="344" text-anchor="middle" font-size="8" font-weight="600" fill="#c96808">not only CKAN</text>

  <!-- DCAT harvest arrow + floating badge above -->
  <line x1="207" y1="318" x2="226" y2="318" stroke="#005b7f" stroke-width="2" marker-end="url(#ld-arr-blue)"/>
  <rect x="180" y="264" width="74" height="16" rx="8" fill="#e8f1f6" stroke="#005b7f" stroke-width="1"/>
  <text x="217" y="276" text-anchor="middle" font-size="8" font-weight="700" fill="#005b7f">DCAT harvest</text>
  <line x1="217" y1="280" x2="217" y2="318" stroke="#005b7f" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- BOX B: PMD DataPortal CKAN (x=228, w=158) -->
  <rect x="228" y="281" width="158" height="74" rx="8" fill="white" stroke="#005b7f" stroke-width="2" filter="url(#ld-shadow-panel)"/>
  <rect x="228" y="281" width="5" height="74" rx="2" fill="#005b7f"/>
  <text x="310" y="299" text-anchor="middle" font-size="10.5" font-weight="700" fill="#005b7f">PMD DataPortal</text>
  <text x="310" y="312" text-anchor="middle" font-size="10.5" font-weight="700" fill="#005b7f">CKAN</text>
  <text x="310" y="325" text-anchor="middle" font-size="8.5" fill="#6c757d">harvests · aggregates</text>
  <text x="310" y="337" text-anchor="middle" font-size="8" fill="#a6bbc8">dataportal.material-digital.de</text>
  <!-- "central" badge -->
  <rect x="258" y="345" width="104" height="5" rx="2" fill="#005b7f" opacity="0.12"/>

  <!-- Arrow: CKAN → Fuseki -->
  <line x1="389" y1="318" x2="401" y2="318" stroke="#a6bbc8" stroke-width="1.8" marker-end="url(#ld-arr-gray)"/>

  <!-- BOX C: Apache Jena Fuseki (x=403, w=110) -->
  <rect x="403" y="281" width="110" height="74" rx="8" fill="white" stroke="#c8d8e4" stroke-width="1.5" filter="url(#ld-shadow-sm)"/>
  <rect x="403" y="281" width="5" height="74" rx="2" fill="#005b7f"/>
  <text x="460" y="299" text-anchor="middle" font-size="10.5" font-weight="700" fill="#343a40">Jena Fuseki</text>
  <text x="460" y="312" text-anchor="middle" font-size="8.5" fill="#6c757d">RDF triplestore</text>
  <text x="460" y="325" text-anchor="middle" font-size="8.5" fill="#6c757d">SPARQL endpoint</text>
  <text x="460" y="338" text-anchor="middle" font-size="8" fill="#a6bbc8">persistent graph store</text>

  <!-- Arrow: Fuseki → Sparklis -->
  <line x1="516" y1="318" x2="528" y2="318" stroke="#a6bbc8" stroke-width="1.8" marker-end="url(#ld-arr-gray)"/>

  <!-- BOX D: Sparklis (x=530, w=90) -->
  <rect x="530" y="281" width="90" height="74" rx="8" fill="white" stroke="#c8d8e4" stroke-width="1.5" filter="url(#ld-shadow-sm)"/>
  <rect x="530" y="281" width="5" height="74" rx="2" fill="#179C7d"/>
  <text x="577" y="299" text-anchor="middle" font-size="10.5" font-weight="700" fill="#343a40">Sparklis</text>
  <text x="577" y="312" text-anchor="middle" font-size="8.5" fill="#6c757d">Faceted query</text>
  <text x="577" y="325" text-anchor="middle" font-size="8.5" fill="#6c757d">no SPARQL</text>
  <text x="577" y="338" text-anchor="middle" font-size="8.5" fill="#6c757d">required</text>

  <!-- Arrow: Sparklis → Consumers -->
  <line x1="623" y1="318" x2="637" y2="318" stroke="#a6bbc8" stroke-width="1.8" marker-end="url(#ld-arr-gray)"/>

  <!-- BOX E: Why persistent URIs matter panel (x=639, w=241) -->
  <rect x="639" y="281" width="241" height="74" rx="8" fill="white" stroke="#179C7d" stroke-width="1.5" filter="url(#ld-shadow-sm)"/>
  <rect x="639" y="281" width="5" height="74" rx="2" fill="#179C7d"/>
  <text x="762" y="298" text-anchor="middle" font-size="10" font-weight="700" fill="#179C7d">Resolve the URI — get the context</text>
  <text x="762" y="311" text-anchor="middle" font-size="8.5" fill="#6c757d">No schema agreement needed.</text>
  <text x="762" y="323" text-anchor="middle" font-size="8.5" fill="#6c757d">Any system that knows the URI</text>
  <text x="762" y="335" text-anchor="middle" font-size="8.5" fill="#6c757d">retrieves the same description —</text>
  <text x="762" y="347" text-anchor="middle" font-size="8.5" fill="#179C7d" font-weight="600">DPP · AI · SPARQL · partner · workflow</text>

  <!-- =========================================================== -->
  <!-- BOTTOM NOTES (two columns)                                  -->
  <!-- =========================================================== -->

  <!-- Left note: Mapping pipeline -->
  <rect x="20" y="365" width="428" height="42" rx="8" fill="white" stroke="#e8eef2" stroke-width="1"/>
  <text x="36" y="381" font-size="8.5" font-weight="700" fill="#a6bbc8">MAPPING PIPELINE</text>
  <text x="36" y="395" font-size="8.5" fill="#6c757d">SQL · CSV · XML · JSON  →  YARRRML / RML mapping  →  RDF triples  →  Fuseki triplestore  →  SPARQL endpoint</text>

  <!-- Right note: Federation principle -->
  <rect x="456" y="365" width="424" height="42" rx="8" fill="white" stroke="#e8eef2" stroke-width="1"/>
  <text x="472" y="381" font-size="8.5" font-weight="700" fill="#a6bbc8">FEDERATION PRINCIPLE</text>
  <text x="472" y="395" font-size="8.5" fill="#6c757d">Each project exposes its own DCAT endpoint · PMD DataPortal harvests all · one discovery catalog for all</text>

  <!-- Footer -->
  <text x="450" y="468" text-anchor="middle" font-size="10" fill="#6c757d">W3C standards: RDF · OWL · SPARQL · DCAT · Persistent identifiers via w3id.org · Open-source stack (CKAN · Jena · Sparklis)</text>
</svg>
